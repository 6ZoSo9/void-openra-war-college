name: VOID Larry reproducible setup v1

on:
  pull_request:
    paths:
      - VOID_LAB_REPRODUCIBLE_SETUP_V1.md
      - scripts/prove_void_lab_reproducible_setup_v1.py
      - .github/workflows/void-larry-reproducible-setup-v1.yml

permissions:
  contents: read

jobs:
  receipt-publication-contract:
    name: Python ${{ matrix.python-version }} receipt publication contract
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile receipt publication proof
        run: python -m py_compile scripts/prove_void_lab_reproducible_setup_v1.py
      - name: Falsify destructive receipt publication
        run: python scripts/prove_void_lab_reproducible_setup_v1.py
