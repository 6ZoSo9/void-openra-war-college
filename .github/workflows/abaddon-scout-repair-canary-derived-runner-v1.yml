name: abaddon-scout-repair-canary-derived-runner-v1

on:
  pull_request:
    paths:
      - "fixtures/learning/scout-missions-v1/warm_start_runner_v1_4.py"
      - "fixtures/learning/scout-missions-v1/scout_repair_canary_derived_runner_v1.py"
      - "openra_env/learning/abaddon_scout_repair_canary_runner_adapter_v1.py"
      - "openra_env/learning/abaddon_scout_repair_canary_runner_requirements_v1.py"
      - "tests/test_abaddon_scout_repair_canary_derived_runner_v1.py"
      - "docs/learning/abaddon-scout-repair-canary-derived-runner-v1.md"
      - ".github/workflows/abaddon-scout-repair-canary-derived-runner-v1.yml"
  push:
    branches: [main]
    paths:
      - "fixtures/learning/scout-missions-v1/warm_start_runner_v1_4.py"
      - "fixtures/learning/scout-missions-v1/scout_repair_canary_derived_runner_v1.py"
      - "openra_env/learning/abaddon_scout_repair_canary_runner_adapter_v1.py"
      - "openra_env/learning/abaddon_scout_repair_canary_runner_requirements_v1.py"
      - "tests/test_abaddon_scout_repair_canary_derived_runner_v1.py"
      - "docs/learning/abaddon-scout-repair-canary-derived-runner-v1.md"
      - ".github/workflows/abaddon-scout-repair-canary-derived-runner-v1.yml"

permissions:
  contents: read

jobs:
  prove:
    name: Python ${{ matrix.python-version }} derived runner source proof
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          submodules: false
          fetch-depth: 2

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install focused dependencies
        run: python -m pip install --disable-pip-version-check pytest ruff

      - name: Compile derived runner and proof
        run: |
          python -m py_compile \
            fixtures/learning/scout-missions-v1/scout_repair_canary_derived_runner_v1.py \
            tests/test_abaddon_scout_repair_canary_derived_runner_v1.py

      - name: Run derived runner source proof
        run: |
          python -m pytest -q \
            tests/test_abaddon_scout_repair_canary_derived_runner_v1.py

      - name: Ruff focused source
        run: |
          python -m ruff check \
            fixtures/learning/scout-missions-v1/scout_repair_canary_derived_runner_v1.py \
            tests/test_abaddon_scout_repair_canary_derived_runner_v1.py

      - name: Diff hygiene
        run: git diff --check
