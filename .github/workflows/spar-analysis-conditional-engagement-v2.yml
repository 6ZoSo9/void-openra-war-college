name: spar-analysis-conditional-engagement-v2

on:
  pull_request:
    paths:
      - __init__.py
      - openra_env/__init__.py
      - openra_env/analysis/**
      - openra_env/coaching/**
      - tools/conditional_engagement_v2_duel_wrapper.py
      - fixtures/training/conditional_engagement_candidate_v2.json
      - tests/test_spar_training_utility.py
      - tests/test_spar_conditional_engagement_v2.py
      - tests/test_spar_pair_comparison.py
      - tests/test_conditional_engagement_v2.py
      - tests/test_conditional_engagement_session_v2.py
      - tests/test_conditional_engagement_v2_duel_wrapper.py
      - .github/workflows/spar-analysis-conditional-engagement-v2.yml
  push:
    branches:
      - main
      - ren/conditional-engagement-v2-pair-comparator-v1
    paths:
      - __init__.py
      - openra_env/__init__.py
      - openra_env/analysis/**
      - openra_env/coaching/**
      - tools/conditional_engagement_v2_duel_wrapper.py
      - fixtures/training/conditional_engagement_candidate_v2.json
      - tests/test_spar_training_utility.py
      - tests/test_spar_conditional_engagement_v2.py
      - tests/test_spar_pair_comparison.py
      - tests/test_conditional_engagement_v2.py
      - tests/test_conditional_engagement_session_v2.py
      - tests/test_conditional_engagement_v2_duel_wrapper.py
      - .github/workflows/spar-analysis-conditional-engagement-v2.yml

permissions:
  contents: read

jobs:
  source-contract:
    name: Python ${{ matrix.python-version }} analysis/coaching contract
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Attest reviewed V2 source hashes
        run: |
          sha256sum \
            openra_env/coaching/conditional_engagement_v2.py \
            openra_env/coaching/conditional_engagement_session_v2.py \
            tools/conditional_engagement_v2_duel_wrapper.py
      - name: Compile focused source
        run: |
          python -m py_compile \
            __init__.py \
            openra_env/__init__.py \
            openra_env/analysis/*.py \
            openra_env/coaching/*.py \
            tools/conditional_engagement_v2_duel_wrapper.py \
            tests/test_spar_training_utility.py \
            tests/test_spar_conditional_engagement_v2.py \
            tests/test_spar_pair_comparison.py \
            tests/test_conditional_engagement_v2.py \
            tests/test_conditional_engagement_session_v2.py \
            tests/test_conditional_engagement_v2_duel_wrapper.py
      - name: Run focused source tests
        run: |
          python -m pytest -q \
            tests/test_spar_training_utility.py \
            tests/test_spar_conditional_engagement_v2.py \
            tests/test_spar_pair_comparison.py \
            tests/test_conditional_engagement_v2.py \
            tests/test_conditional_engagement_session_v2.py \
            tests/test_conditional_engagement_v2_duel_wrapper.py
      - name: Verify exact candidate fixture
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from openra_env.coaching.conditional_engagement_v2 import (
              candidate_sha256,
              validate_candidate,
          )

          expected = "27f28a6a46f63a055f8f35c021bafae1035084c444ba7e2009161109ec3efdd6"
          path = Path("fixtures/training/conditional_engagement_candidate_v2.json")
          candidate = json.loads(path.read_text(encoding="utf-8"))
          validate_candidate(candidate)
          assert candidate_sha256(candidate) == expected
          assert hashlib.sha256(path.read_bytes()).hexdigest() == expected
          assert candidate["candidate_only"] is True
          assert candidate["automatic_apollyon_weight_mutation"] is False
          assert candidate["automatic_abaddon_policy_promotion"] is False
          assert candidate["automatic_corpus_admission"] is False
          print("CONDITIONAL_ENGAGEMENT_CANDIDATE_V2_EXACT_GREEN")
          PY
