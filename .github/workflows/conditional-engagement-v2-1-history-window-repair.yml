name: conditional-engagement-v2-1-history-window-repair

on:
  pull_request:
    paths:
      - openra_env/analysis/_spar_conditional_v2_1.py
      - tests/test_spar_conditional_engagement_v2_1.py
      - tests/test_spar_conditional_engagement_v2_1_history_window.py
      - fixtures/training/conditional_engagement_candidate_v2_1.json
      - .github/workflows/conditional-engagement-v2-1-history-window-repair.yml
  push:
    branches:
      - ren/v2-1-history-window-evidence-repair-v1
    paths:
      - openra_env/analysis/_spar_conditional_v2_1.py
      - tests/test_spar_conditional_engagement_v2_1_history_window.py
      - .github/workflows/conditional-engagement-v2-1-history-window-repair.yml

permissions:
  contents: read

jobs:
  contract:
    name: Python ${{ matrix.python-version }} V2.1 history evidence contract
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile V2.1 history evidence repair
        run: |
          python -m py_compile \
            openra_env/analysis/_spar_conditional_v2_1.py \
            tests/test_spar_conditional_engagement_v2_1.py \
            tests/test_spar_conditional_engagement_v2_1_history_window.py
      - name: Run V2.1 evidence and history-window tests
        run: |
          python -m pytest -q \
            tests/test_spar_conditional_engagement_v2_1.py \
            tests/test_spar_conditional_engagement_v2_1_history_window.py
      - name: Prove reviewed history window remains six
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from openra_env.analysis._spar_conditional_v2_1 import REVIEWED_V21_HISTORY_WINDOW_ROUNDS
          from openra_env.analysis._spar_conditional_v2_1_reviewed_identity import REVIEWED_V21_IDENTITY
          from openra_env.coaching.conditional_engagement_v2_1 import candidate_sha256, validate_candidate

          path = Path('fixtures/training/conditional_engagement_candidate_v2_1.json')
          candidate = json.loads(path.read_text(encoding='utf-8'))
          validate_candidate(candidate)
          assert candidate_sha256(candidate) == REVIEWED_V21_IDENTITY['candidate_sha256']
          assert candidate['thresholds']['history_window_rounds'] == 6
          assert REVIEWED_V21_HISTORY_WINDOW_ROUNDS == 6
          print('CONDITIONAL_ENGAGEMENT_V2_1_HISTORY_WINDOW_EXACT_GREEN')
          PY
