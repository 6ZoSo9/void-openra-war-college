name: conditional-engagement-v2-2-conversion-utility-source-contract

on:
  pull_request:
    paths:
      - openra_env/analysis/spar_v22_conversion_utility.py
      - openra_env/analysis/_spar_conditional_v2_2.py
      - tests/test_spar_v22_conversion_utility.py
      - .github/workflows/conditional-engagement-v2-2-conversion-utility-source-contract.yml

permissions:
  contents: read

jobs:
  contract:
    name: Python ${{ matrix.python-version }} V2.2 conversion utility
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install focused dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile conversion utility
        run: |
          python -m py_compile \
            openra_env/analysis/spar_v22_conversion_utility.py \
            tests/test_spar_v22_conversion_utility.py
      - name: Run conversion utility tests
        run: python -m pytest -q tests/test_spar_v22_conversion_utility.py
      - name: Prove no seed-specific conversion logic
        run: |
          ! grep -nE '\b2051\b|\b2052\b|\b2053\b|\b2054\b|\b2055\b|\b2060\b' \
            openra_env/analysis/spar_v22_conversion_utility.py
          echo CONDITIONAL_ENGAGEMENT_V2_2_CONVERSION_UTILITY_GREEN
