name: OpenBW Neutral Duel Compile v1

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/openbw-neutral-duel-compile-v1.yml"
      - "integrations/openbw/**"
      - "openra_env/learning/openbw_neutral_duel_harness_v1.py"
      - "tests/test_openbw_neutral_duel_harness_v1.py"
      - "docs/learning/openbw-neutral-duel-harness-v1.md"
      - "scripts/apply_openbw_bwapi_cstdint_compat_v1.py"
  pull_request:
    paths:
      - ".github/workflows/openbw-neutral-duel-compile-v1.yml"
      - "integrations/openbw/**"
      - "openra_env/learning/openbw_neutral_duel_harness_v1.py"
      - "tests/test_openbw_neutral_duel_harness_v1.py"
      - "docs/learning/openbw-neutral-duel-harness-v1.md"
      - "scripts/apply_openbw_bwapi_cstdint_compat_v1.py"

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OPENBW_SHA: 4b046d5f65302b10cb0a745f0fecd37ec85b20a8
      BWAPI_SHA: 48124ba8ed1b4d52b3dfd52acbaf34afb9a37fe2
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          submodules: false

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: "3.12"

      - name: Validate source-only harness
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile             openra_env/learning/openbw_neutral_duel_harness_v1.py             tests/test_openbw_neutral_duel_harness_v1.py             scripts/apply_openbw_bwapi_cstdint_compat_v1.py
          python - <<'PY'
          from openra_env.learning.openbw_neutral_duel_harness_v1 import neutral_duel_contract
          c = neutral_duel_contract()
          assert c["authority"]["runtime_authorized"] is False
          assert c["authority"]["game_execution_authorized"] is False
          assert c["bots"]["A"]["actual_apollyon"] is False
          assert c["bots"]["B"]["actual_abaddon"] is False
          print("OPENBW_NEUTRAL_DUEL_SOURCE_CONTRACT_GREEN")
          PY

      - name: Fetch pinned upstream source
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/openbw-neutral-duel"
          mkdir -p "$root"

          git init "$root/openbw"
          git -C "$root/openbw" remote add origin https://github.com/OpenBW/openbw.git
          git -C "$root/openbw" -c protocol.version=2 fetch --no-tags --depth=1 origin "$OPENBW_SHA"
          git -C "$root/openbw" checkout --detach FETCH_HEAD

          git init "$root/bwapi"
          git -C "$root/bwapi" remote add origin https://github.com/OpenBW/bwapi.git
          git -C "$root/bwapi" -c protocol.version=2 fetch --no-tags --depth=1 origin "$BWAPI_SHA"
          git -C "$root/bwapi" checkout --detach FETCH_HEAD

          test "$(git -C "$root/openbw" rev-parse HEAD)" = "$OPENBW_SHA"
          test "$(git -C "$root/bwapi" rev-parse HEAD)" = "$BWAPI_SHA"

      - name: Apply exact upstream GCC 13 patch
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/openbw-neutral-duel"
          python scripts/apply_openbw_bwapi_cstdint_compat_v1.py             --checkout "$root/bwapi"
          test "$(git -C "$root/bwapi" hash-object bwapi/include/BWAPI/Game.h)" =             "debb572f6eb23c44ff1096bf8ba3ebea5da3ac7b"

      - name: Build headless BWAPI
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/openbw-neutral-duel"
          cmake             -S "$root/bwapi"             -B "$root/bwapi-build"             -DCMAKE_BUILD_TYPE=Release             -DOPENBW_DIR="$root/openbw"             -DOPENBW_ENABLE_UI=0
          cmake --build "$root/bwapi-build" --parallel 2 --target BWAPILauncher
          test -x "$root/bwapi-build/bin/BWAPILauncher"
          echo "OPENBW_BASE_BUILD_GREEN"

      - name: Build War College neutral bots
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/openbw-neutral-duel"
          cmake             -S integrations/openbw             -B "$root/bot-build"             -DCMAKE_BUILD_TYPE=Release             -DBWAPI_SOURCE_ROOT="$root/bwapi"             -DBWAPI_BUILD_ROOT="$root/bwapi-build"
          cmake --build "$root/bot-build" --parallel 2
          a="$root/bot-build/lib/VoidOpenBWSmokeBotA.so"
          b="$root/bot-build/lib/VoidOpenBWSmokeBotB.so"
          test -f "$a" && test -x "$a"
          test -f "$b" && test -x "$b"
          file "$a"
          file "$b"
          nm -D "$a" | grep -Eq '[[:space:]]T[[:space:]]gameInit$'
          nm -D "$a" | grep -Eq '[[:space:]]T[[:space:]]newAIModule$'
          nm -D "$b" | grep -Eq '[[:space:]]T[[:space:]]gameInit$'
          nm -D "$b" | grep -Eq '[[:space:]]T[[:space:]]newAIModule$'
          readelf -d "$a" | grep -F 'libBWAPILIB.so'
          readelf -d "$b" | grep -F 'libBWAPILIB.so'
          sha256sum "$a" "$b"
          echo "launcher_executed=false"
          echo "bot_a_loaded=false"
          echo "bot_b_loaded=false"
          echo "game_assets_read=false"
          echo "game_session_created=false"
          echo "model_executed=false"
          echo "training_performed=false"
          echo "OPENBW_NEUTRAL_DUEL_COMPILE_GREEN"
