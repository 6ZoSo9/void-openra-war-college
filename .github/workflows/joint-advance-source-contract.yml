name: joint-advance-source-contract

on:
  pull_request:
    paths:
      - bench_joint_advance.py
      - test_bench_joint_advance.py
      - .github/workflows/joint-advance-source-contract.yml
  push:
    branches:
      - main
    paths:
      - bench_joint_advance.py
      - test_bench_joint_advance.py
      - .github/workflows/joint-advance-source-contract.yml

permissions:
  contents: read

jobs:
  source-contract:
    name: Python ${{ matrix.python-version }} source contract
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    env:
      SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SOURCE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      INTEGRATION_SHA: ${{ github.sha }}
    steps:
      - name: Checkout integration generation
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Checkout exact benchmark source head
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ env.SOURCE_HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false
          path: exact-head
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Prove integration and exact-head source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$INTEGRATION_SHA"
          test "$(git -C exact-head rev-parse HEAD)" = "$SOURCE_HEAD_SHA"
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          paths = (
              "bench_joint_advance.py",
              "test_bench_joint_advance.py",
              ".github/workflows/joint-advance-source-contract.yml",
          )
          manifest = {}
          for rel in paths:
              integration_bytes = Path(rel).read_bytes()
              source_bytes = (Path("exact-head") / rel).read_bytes()
              if integration_bytes != source_bytes:
                  raise SystemExit(f"integration/source byte mismatch: {rel}")
              manifest[rel] = {
                  "sha256": hashlib.sha256(source_bytes).hexdigest(),
                  "bytes": len(source_bytes),
              }
          print(json.dumps(manifest, sort_keys=True, separators=(",", ":")))
          PY
      - name: Verify committed-range hygiene
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git -C exact-head cat-file -e "${SOURCE_BASE_SHA}^{commit}"
          git -C exact-head cat-file -e "${SOURCE_HEAD_SHA}^{commit}"
          git -C exact-head diff --check "${SOURCE_BASE_SHA}...${SOURCE_HEAD_SHA}"
      - name: Verify pushed-head hygiene
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          if git -C exact-head rev-parse HEAD^ >/dev/null 2>&1; then
            git -C exact-head diff --check HEAD^ HEAD
          else
            git -C exact-head diff --check HEAD
          fi
      - name: Compile integration source contract
        run: python -m py_compile bench_joint_advance.py test_bench_joint_advance.py
      - name: Run integration source contract tests
        run: python -m unittest -v test_bench_joint_advance.py
      - name: Verify exact-head source-only plan
        shell: bash
        run: |
          set -euo pipefail
          python exact-head/bench_joint_advance.py plan \
            --engine-sha 1607a7a6501d42a47638393ecef8b22831064932 \
            --war-college-sha 973802ef0a614e5afa782ff20e231e18966ae3e5 \
            --benchmark-source-sha "$SOURCE_HEAD_SHA" \
            --concurrency 1,2 \
            --tick-batches 1,8 \
            --samples 2 \
            --repetitions 2 \
            --seed 2050 > joint-advance-plan.json
          python -c 'import json; d=json.load(open("joint-advance-plan.json", encoding="utf-8")); assert d["runtime_evidence"] == "PENDING_DESIGNATED_HOST"; assert d["cells"] == []; assert d["run"] is None'
