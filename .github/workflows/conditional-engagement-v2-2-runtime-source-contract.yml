name: conditional-engagement-v2-2-runtime-source-contract

on:
  pull_request:
    paths:
      - openra_env/coaching/conditional_engagement_v2_2.py
      - openra_env/coaching/conditional_engagement_session_v2_2.py
      - openra_env/analysis/_spar_conditional_v2_2.py
      - openra_env/analysis/_spar_conditional_v2_2_reviewed_identity.py
      - openra_env/analysis/spar_training_utility.py
      - tools/conditional_engagement_v2_2_duel_wrapper.py
      - tests/test_conditional_engagement_v2_2.py
      - tests/test_conditional_engagement_v2_2_duel_wrapper.py
      - tests/test_conditional_engagement_v2_2_direct_exec.py
      - tests/test_spar_conditional_engagement_v2_2.py
      - .github/workflows/conditional-engagement-v2-2-runtime-source-contract.yml
  push:
    branches:
      - main
      - ren/v2-2-selector-integrity-r1
    paths:
      - openra_env/coaching/conditional_engagement_v2_2.py
      - openra_env/coaching/conditional_engagement_session_v2_2.py
      - openra_env/analysis/_spar_conditional_v2_2.py
      - openra_env/analysis/_spar_conditional_v2_2_reviewed_identity.py
      - openra_env/analysis/spar_training_utility.py
      - tools/conditional_engagement_v2_2_duel_wrapper.py
      - tests/test_conditional_engagement_v2_2.py
      - tests/test_conditional_engagement_v2_2_duel_wrapper.py
      - tests/test_conditional_engagement_v2_2_direct_exec.py
      - tests/test_spar_conditional_engagement_v2_2.py
      - .github/workflows/conditional-engagement-v2-2-runtime-source-contract.yml

permissions:
  contents: read

jobs:
  contract:
    name: Python ${{ matrix.python-version }} V2.2 runtime/evidence contract
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install focused dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Attest V2.2 reviewed source hashes
        run: |
          sha256sum \
            openra_env/coaching/conditional_engagement_v2_2.py \
            openra_env/coaching/conditional_engagement_session_v2_2.py \
            tools/conditional_engagement_v2_2_duel_wrapper.py
      - name: Compile V2.2 runtime/evidence source
        run: |
          python -m py_compile \
            openra_env/coaching/conditional_engagement_v2_2.py \
            openra_env/coaching/conditional_engagement_session_v2_2.py \
            openra_env/analysis/_spar_conditional_v2_2.py \
            openra_env/analysis/_spar_conditional_v2_2_reviewed_identity.py \
            openra_env/analysis/spar_training_utility.py \
            tools/conditional_engagement_v2_2_duel_wrapper.py \
            tests/test_conditional_engagement_v2_2.py \
            tests/test_conditional_engagement_v2_2_duel_wrapper.py \
            tests/test_conditional_engagement_v2_2_direct_exec.py \
            tests/test_spar_conditional_engagement_v2_2.py
      - name: Run V2.2 runtime/evidence tests
        run: |
          python -m pytest -q \
            tests/test_conditional_engagement_v2_2.py \
            tests/test_conditional_engagement_v2_2_duel_wrapper.py \
            tests/test_conditional_engagement_v2_2_direct_exec.py \
            tests/test_spar_conditional_engagement_v2_2.py
      - name: Verify exact V2.2 candidate and reviewed identity
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from openra_env.analysis._spar_conditional_v2_2_reviewed_identity import REVIEWED_V22_IDENTITY
          from openra_env.coaching.conditional_engagement_v2_2 import candidate_sha256, validate_candidate

          expected_candidate = '92f10e87f01a388882f621a09989783d561302cc46583a5344e8108c81d864ab'
          fixture = Path('fixtures/training/conditional_engagement_candidate_v2_2.json')
          candidate = json.loads(fixture.read_text(encoding='utf-8'))
          validate_candidate(candidate)
          assert candidate_sha256(candidate) == expected_candidate
          assert hashlib.sha256(fixture.read_bytes()).hexdigest() == expected_candidate

          actual_identity = {
              'source_commit': 'c7084294253793b101cc2826726a8cfa0b294c37',
              'candidate_sha256': expected_candidate,
              'policy_sha256': hashlib.sha256(Path('openra_env/coaching/conditional_engagement_v2_2.py').read_bytes()).hexdigest(),
              'session_sha256': hashlib.sha256(Path('openra_env/coaching/conditional_engagement_session_v2_2.py').read_bytes()).hexdigest(),
              'wrapper_sha256': hashlib.sha256(Path('tools/conditional_engagement_v2_2_duel_wrapper.py').read_bytes()).hexdigest(),
          }
          print('R1_ACTUAL_IDENTITY=' + repr(actual_identity))
          assert actual_identity == REVIEWED_V22_IDENTITY
          print('CONDITIONAL_ENGAGEMENT_V2_2_RUNTIME_EVIDENCE_EXACT_GREEN')
          PY
