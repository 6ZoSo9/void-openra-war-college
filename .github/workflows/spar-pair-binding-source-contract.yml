name: spar-pair-binding-source-contract

on:
  pull_request:
    paths:
      - openra_env/analysis/spar_pair_binding.py
      - openra_env/analysis/spar_pair_comparison.py
      - tests/test_spar_pair_binding.py
      - tests/test_spar_pair_comparison.py
      - .github/workflows/spar-pair-binding-source-contract.yml
  push:
    branches:
      - main
    paths:
      - openra_env/analysis/spar_pair_binding.py
      - openra_env/analysis/spar_pair_comparison.py
      - tests/test_spar_pair_binding.py
      - tests/test_spar_pair_comparison.py
      - .github/workflows/spar-pair-binding-source-contract.yml

permissions:
  contents: read

jobs:
  contract:
    name: Python ${{ matrix.python-version }} normalized pair binding
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile normalized pair source
        run: |
          python -m py_compile \
            openra_env/analysis/spar_pair_binding.py \
            openra_env/analysis/spar_pair_comparison.py \
            tests/test_spar_pair_binding.py \
            tests/test_spar_pair_comparison.py
      - name: Run normalized pair contract
        run: |
          python -m pytest -q \
            tests/test_spar_pair_binding.py \
            tests/test_spar_pair_comparison.py
