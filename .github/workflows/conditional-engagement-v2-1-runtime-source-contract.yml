name: conditional-engagement-v2-1-runtime-source-contract

on:
  pull_request:
    paths:
      - openra_env/coaching/conditional_engagement_v2_1.py
      - openra_env/coaching/conditional_engagement_session_v2_1.py
      - openra_env/analysis/_spar_conditional_v2_1.py
      - openra_env/analysis/_spar_conditional_v2_1_reviewed_identity.py
      - openra_env/analysis/spar_training_utility.py
      - tools/conditional_engagement_v2_duel_wrapper.py
      - tools/conditional_engagement_v2_1_duel_wrapper.py
      - fixtures/training/conditional_engagement_candidate_v2_1.json
      - tests/test_conditional_engagement_v2_1.py
      - tests/test_conditional_engagement_v2_1_duel_wrapper.py
      - tests/test_spar_conditional_engagement_v2_1.py
      - .github/workflows/conditional-engagement-v2-1-runtime-source-contract.yml
  push:
    branches:
      - ren/conditional-engagement-v2-1-runtime-integration-v1
    paths:
      - openra_env/coaching/conditional_engagement_v2_1.py
      - openra_env/coaching/conditional_engagement_session_v2_1.py
      - openra_env/analysis/_spar_conditional_v2_1.py
      - openra_env/analysis/_spar_conditional_v2_1_reviewed_identity.py
      - openra_env/analysis/spar_training_utility.py
      - tools/conditional_engagement_v2_1_duel_wrapper.py
      - tests/test_conditional_engagement_v2_1_duel_wrapper.py
      - tests/test_spar_conditional_engagement_v2_1.py
      - .github/workflows/conditional-engagement-v2-1-runtime-source-contract.yml

permissions:
  contents: read

jobs:
  contract:
    name: Python ${{ matrix.python-version }} V2.1 runtime/evidence contract
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Attest V2.1 reviewed source hashes
        run: |
          sha256sum \
            openra_env/coaching/conditional_engagement_v2_1.py \
            openra_env/coaching/conditional_engagement_session_v2_1.py \
            tools/conditional_engagement_v2_1_duel_wrapper.py
      - name: Compile V2.1 runtime and evidence source
        run: |
          python -m py_compile \
            openra_env/coaching/conditional_engagement_v2_1.py \
            openra_env/coaching/conditional_engagement_session_v2_1.py \
            openra_env/analysis/_spar_conditional_v2_1.py \
            openra_env/analysis/_spar_conditional_v2_1_reviewed_identity.py \
            openra_env/analysis/spar_training_utility.py \
            tools/conditional_engagement_v2_duel_wrapper.py \
            tools/conditional_engagement_v2_1_duel_wrapper.py \
            tests/test_conditional_engagement_v2_1.py \
            tests/test_conditional_engagement_v2_1_duel_wrapper.py \
            tests/test_spar_conditional_engagement_v2_1.py
      - name: Run V2.1 runtime and evidence tests
        run: |
          python -m pytest -q \
            tests/test_conditional_engagement_v2_1.py \
            tests/test_conditional_engagement_v2_1_duel_wrapper.py \
            tests/test_spar_conditional_engagement_v2_1.py
      - name: Verify exact V2.1 candidate fixture and reviewed identity
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from openra_env.coaching.conditional_engagement_v2_1 import candidate_sha256, validate_candidate
          from openra_env.analysis._spar_conditional_v2_1_reviewed_identity import REVIEWED_V21_IDENTITY

          expected = "a0b08f7a7ea807de53416f589790059e2540404f680d6b470395bdbdc067f460"
          path = Path("fixtures/training/conditional_engagement_candidate_v2_1.json")
          candidate = json.loads(path.read_text(encoding="utf-8"))
          validate_candidate(candidate)
          assert candidate_sha256(candidate) == expected
          assert hashlib.sha256(path.read_bytes()).hexdigest() == expected
          assert REVIEWED_V21_IDENTITY == {
              "source_commit": "bf4f5640e7a99cbac5cbda6e5ce33769237de069",
              "candidate_sha256": expected,
              "policy_sha256": "3816048beae8d282532f59e3c2b914fb9d8e303bd4ae539cdb699b8d1e5b89f3",
              "session_sha256": "1dacb413a0f09afcd953f02c8800677619111833a777785dd22ae433aca365e8",
              "wrapper_sha256": "e80b8870011fa917381cdaaef3db6c1f4d583db6f8690449135eddb8cc052805",
          }
          print("CONDITIONAL_ENGAGEMENT_V2_1_RUNTIME_EVIDENCE_EXACT_GREEN")
          PY
