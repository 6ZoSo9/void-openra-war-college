name: general-obedience-kernel-source-contract

on:
  pull_request:
    paths:
      - openra_env/learning/general_obedience.py
      - fixtures/learning/apollyon-obedience-kernel-v1.json
      - fixtures/learning/abaddon-obedience-kernel-v1.json
      - tests/test_general_obedience.py
      - .github/workflows/general-obedience-kernel-source-contract.yml
  push:
    branches:
      - ren/general-brain-obedience-kernel-v1
    paths:
      - openra_env/learning/general_obedience.py
      - fixtures/learning/apollyon-obedience-kernel-v1.json
      - fixtures/learning/abaddon-obedience-kernel-v1.json
      - tests/test_general_obedience.py
      - .github/workflows/general-obedience-kernel-source-contract.yml

permissions:
  contents: read

jobs:
  contract:
    name: Python ${{ matrix.python-version }} General obedience kernel
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install focused dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile obedience kernel
        run: |
          python -m py_compile \
            openra_env/learning/general_obedience.py \
            tests/test_general_obedience.py
      - name: Run obedience kernel tests
        run: python -m pytest -q tests/test_general_obedience.py
      - name: Prove model-independent authority boundary
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          from openra_env.learning.general_obedience import (
              enforce_tool_choice,
              make_obedience_profile,
              make_tool_directive,
              resolve_directives,
          )

          for general in ('apollyon', 'abaddon'):
              profile = make_obedience_profile(general)
              model = make_tool_directive(
                  directive_id='model-fake',
                  issuer_role='model_training',
                  tool_rules={'attack_move': 'allow'},
              )
              queen = make_tool_directive(
                  directive_id='queen-rule',
                  issuer_role='brood_queen',
                  tool_rules={'attack_move': 'allow'},
              )
              sovereign = make_tool_directive(
                  directive_id='sovereign-rule',
                  issuer_role='sovereign',
                  tool_rules={'attack_move': 'deny'},
              )
              resolved = resolve_directives(profile, [model, queen, sovereign])
              assert resolved['ignored_directives'][0]['issuer_role'] == 'model_training'
              verdict = enforce_tool_choice(resolved, 'attack_move')
              assert verdict['decision'] == 'DENY'
              assert verdict['binding_rule']['issuer_role'] == 'sovereign'
              assert profile['obedience_profile_trainable'] is False
              assert profile['base_model_can_modify_obedience'] is False
              assert profile['competence_adapter_can_modify_obedience'] is False
          print('VOID_GENERAL_OBEDIENCE_KERNEL_BOUNDARY_GREEN')
          PY
