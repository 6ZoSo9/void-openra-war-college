name: VOID Larry lab checkout contract v1

on:
  pull_request:
    paths:
      - scripts/verify_void_lab_checkout_v1.py
      - tests/test_verify_void_lab_checkout_v1.py
      - .github/workflows/void-larry-lab-checkout-contract-v1.yml
      - .gitmodules
      - OpenRA
  push:
    branches:
      - main
    paths:
      - scripts/verify_void_lab_checkout_v1.py
      - tests/test_verify_void_lab_checkout_v1.py
      - .github/workflows/void-larry-lab-checkout-contract-v1.yml
      - .gitmodules
      - OpenRA

permissions:
  contents: read

jobs:
  source-contract:
    name: Python ${{ matrix.python-version }} source contract
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile checkout contract
        run: python -m py_compile scripts/verify_void_lab_checkout_v1.py tests/test_verify_void_lab_checkout_v1.py
      - name: Run checkout contract tests
        run: python -m unittest -v tests/test_verify_void_lab_checkout_v1.py
      - name: Verify preserved source composition without private credentials
        run: |
          python scripts/verify_void_lab_checkout_v1.py --source-only > lab-checkout-source-contract.json
          python -c 'import json; d=json.load(open("lab-checkout-source-contract.json", encoding="utf-8")); assert d["source_contract"] == "GREEN"; assert d["checkout_contract"] == "PENDING_ENGINE_CHECKOUT"; assert d["requested_contract"] == "COMMITTED_TRACKED_COMPOSITION_ONLY"; assert d["source_only_limitation"] == "DOES_NOT_ASSERT_EXACT_DESIGNATED_HOST_COMPOSITION"; assert d["exact_checkout_evidence"] is False; assert d["runtime_evidence"] == "PENDING_DESIGNATED_HOST"'
