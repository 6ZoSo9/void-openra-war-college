name: OpenBW Online CASC Metadata Compile v1

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/openbw-online-casc-metadata-compile-v1.yml"
      - "integrations/openbw/online_casc_metadata_probe.cpp"
      - "integrations/openbw/online_casc_metadata_probe.CMakeLists.txt"
      - "openra_env/learning/openbw_online_casc_metadata_probe_v1.py"
      - "tests/test_openbw_online_casc_metadata_probe_v1.py"
      - "docs/learning/openbw-online-casc-metadata-probe-v1.md"
  pull_request:
    paths:
      - ".github/workflows/openbw-online-casc-metadata-compile-v1.yml"
      - "integrations/openbw/online_casc_metadata_probe.cpp"
      - "integrations/openbw/online_casc_metadata_probe.CMakeLists.txt"
      - "openra_env/learning/openbw_online_casc_metadata_probe_v1.py"
      - "tests/test_openbw_online_casc_metadata_probe_v1.py"
      - "docs/learning/openbw-online-casc-metadata-probe-v1.md"

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CASCLIB_SHA: 2a280f5a231966dc5d1b534978dd9f9f04a374cd
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          submodules: false

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: "3.12"

      - name: Validate source-only contract
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile             openra_env/learning/openbw_online_casc_metadata_probe_v1.py             tests/test_openbw_online_casc_metadata_probe_v1.py
          python - <<'PY'
          from openra_env.learning.openbw_online_casc_metadata_probe_v1 import online_casc_metadata_contract
          c = online_casc_metadata_contract()
          assert c["behavior"]["open_game_file_payload"] is False
          assert c["behavior"]["read_game_file_payload"] is False
          assert all(v is False for v in c["authority"].values())
          print("OPENBW_ONLINE_CASC_METADATA_SOURCE_CONTRACT_GREEN")
          PY

      - name: Fetch and build pinned CascLib
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/openbw-online-casc-metadata"
          git init "$root/casclib"
          git -C "$root/casclib" remote add origin https://github.com/ladislav-zezula/CascLib.git
          git -C "$root/casclib" -c protocol.version=2 fetch --no-tags --depth=1 origin "$CASCLIB_SHA"
          git -C "$root/casclib" checkout --detach FETCH_HEAD
          test "$(git -C "$root/casclib" rev-parse HEAD)" = "$CASCLIB_SHA"
          test "$(git -C "$root/casclib" rev-parse HEAD:LICENSE)" =             "3b17df3d9bc1d17b55b61024baec95bfb1f264ea"

          cmake             -S "$root/casclib"             -B "$root/casc-build"             -DCMAKE_BUILD_TYPE=Release             -DCMAKE_INSTALL_PREFIX="$root/casc-install"             -DCMAKE_INSTALL_LIBDIR=lib             -DCASC_BUILD_SHARED_LIB=ON             -DCASC_BUILD_STATIC_LIB=OFF             -DCASC_BUILD_TESTS=OFF
          cmake --build "$root/casc-build" --parallel 2
          cmake --install "$root/casc-build"

      - name: Compile metadata-only StarCraft probe
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/openbw-online-casc-metadata"
          src="$root/probe-src"
          mkdir -p "$src"
          cp integrations/openbw/online_casc_metadata_probe.cpp "$src/online_casc_metadata_probe.cpp"
          cp integrations/openbw/online_casc_metadata_probe.CMakeLists.txt "$src/CMakeLists.txt"

          cmake             -S "$src"             -B "$root/probe-build"             -DCMAKE_BUILD_TYPE=Release             -DVOID_CASCLIB_INSTALL_ROOT="$root/casc-install"
          cmake --build "$root/probe-build" --parallel 2

          probe="$root/probe-build/openbw_online_casc_metadata_probe"
          test -x "$probe"
          nm -D "$probe" | grep -F 'CascOpenOnlineStorage'
          if nm -D "$probe" | grep -Eq 'Casc(Open|Read)File'; then
            echo "forbidden payload symbol linked" >&2
            exit 1
          fi
          echo "network_probe_execution=false"
          echo "game_payload_open=false"
          echo "game_payload_read=false"
          echo "OPENBW_ONLINE_CASC_METADATA_COMPILE_GREEN"
