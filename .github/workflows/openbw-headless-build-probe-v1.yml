name: OpenBW Headless Build Probe v1

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/openbw-headless-build-probe-v1.yml"
      - "openra_env/learning/openbw_arena_probe_v1.py"
      - "tests/test_openbw_arena_probe_v1.py"
      - "docs/learning/openbw-arena-probe-v1.md"
      - "scripts/apply_openbw_bwapi_cstdint_compat_v1.py"
  pull_request:
    paths:
      - ".github/workflows/openbw-headless-build-probe-v1.yml"
      - "openra_env/learning/openbw_arena_probe_v1.py"
      - "tests/test_openbw_arena_probe_v1.py"
      - "docs/learning/openbw-arena-probe-v1.md"
      - "scripts/apply_openbw_bwapi_cstdint_compat_v1.py"

permissions:
  contents: read

jobs:
  build-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OPENBW_SHA: 4b046d5f65302b10cb0a745f0fecd37ec85b20a8
      BWAPI_SHA: 48124ba8ed1b4d52b3dfd52acbaf34afb9a37fe2
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          submodules: false

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: "3.12"

      - name: Validate War College source contract
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            openra_env/learning/openbw_arena_probe_v1.py \
            tests/test_openbw_arena_probe_v1.py \
            scripts/apply_openbw_bwapi_cstdint_compat_v1.py
          python - <<'PY'
          from openra_env.learning.openbw_arena_probe_v1 import openbw_arena_probe_contract
          c = openbw_arena_probe_contract()
          assert c["integration"]["build_only"] is True
          assert c["integration"]["launcher_execution"] is False
          assert c["authority"]["game_execution_authorized"] is False
          print("OPENBW_ARENA_SOURCE_CONTRACT_GREEN")
          PY

      - name: Fetch exact public upstream sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/openbw-probe"
          cd "$RUNNER_TEMP/openbw-probe"

          git init openbw
          git -C openbw remote add origin https://github.com/OpenBW/openbw.git
          git -C openbw -c protocol.version=2 fetch --no-tags --depth=1 origin "$OPENBW_SHA"
          git -C openbw checkout --detach FETCH_HEAD

          git init bwapi
          git -C bwapi remote add origin https://github.com/OpenBW/bwapi.git
          git -C bwapi -c protocol.version=2 fetch --no-tags --depth=1 origin "$BWAPI_SHA"
          git -C bwapi checkout --detach FETCH_HEAD

          test "$(git -C openbw rev-parse HEAD)" = "$OPENBW_SHA"
          test "$(git -C bwapi rev-parse HEAD)" = "$BWAPI_SHA"
          test ! -e openbw/LICENSE
          test ! -e openbw/COPYING
          test "$(git -C bwapi hash-object LICENSE)" = "65c5ca88a67c30becee01c5a8816d964b03862f9"
          echo "OPENBW_UPSTREAM_IDENTITY_GREEN"

      - name: Apply exact upstream GCC 13 compatibility patch
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/openbw-probe"
          python scripts/apply_openbw_bwapi_cstdint_compat_v1.py \
            --checkout "$root/bwapi"
          test "$(git -C "$root/bwapi" hash-object bwapi/include/BWAPI/Game.h)" = \
            "debb572f6eb23c44ff1096bf8ba3ebea5da3ac7b"

      - name: Configure headless OpenBW BWAPI
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/openbw-probe"
          cmake             -S "$root/bwapi"             -B "$root/build"             -DCMAKE_BUILD_TYPE=Release             -DOPENBW_DIR="$root/openbw"             -DOPENBW_ENABLE_UI=0
          echo "OPENBW_HEADLESS_CONFIGURE_GREEN"

      - name: Build BWAPILauncher without executing it
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/openbw-probe"
          cmake --build "$root/build" --parallel 2 --target BWAPILauncher
          launcher="$root/build/bin/BWAPILauncher"
          test -f "$launcher"
          test -x "$launcher"
          file "$launcher"
          echo "OPENBW_BWAPILAUNCHER_BUILD_GREEN"
          echo "launcher_executed=false"
          echo "game_assets_read=false"
          echo "game_assets_downloaded=false"
          echo "game_session_created=false"
          echo "model_executed=false"
          echo "training_performed=false"
