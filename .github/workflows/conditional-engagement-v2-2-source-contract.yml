name: conditional-engagement-v2-2-source-contract

on:
  pull_request:
    paths:
      - openra_env/coaching/conditional_engagement_v2_2.py
      - openra_env/coaching/conditional_engagement_session_v2_2.py
      - openra_env/coaching/__init__.py
      - fixtures/training/conditional_engagement_candidate_v2_2.json
      - tests/test_conditional_engagement_v2_2.py
      - .github/workflows/conditional-engagement-v2-2-source-contract.yml
  push:
    branches:
      - main
    paths:
      - openra_env/coaching/conditional_engagement_v2_2.py
      - openra_env/coaching/conditional_engagement_session_v2_2.py
      - openra_env/coaching/__init__.py
      - fixtures/training/conditional_engagement_candidate_v2_2.json
      - tests/test_conditional_engagement_v2_2.py
      - .github/workflows/conditional-engagement-v2-2-source-contract.yml

permissions:
  contents: read

jobs:
  contract:
    name: Python ${{ matrix.python-version }} V2.2 source contract
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install focused dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile V2.2 source
        run: |
          python -m py_compile \
            openra_env/coaching/conditional_engagement_v2_2.py \
            openra_env/coaching/conditional_engagement_session_v2_2.py \
            openra_env/coaching/__init__.py \
            tests/test_conditional_engagement_v2_2.py
      - name: Run V2.2 focused tests
        run: python -m pytest -q tests/test_conditional_engagement_v2_2.py
      - name: Verify exact V2.2 candidate and selector integrity
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from openra_env.coaching.conditional_engagement_v2_2 import (
              EXPECTED_CANDIDATE_SHA256,
              candidate_sha256,
              format_coaching,
              select_mode,
              snapshot_from_state,
              validate_candidate,
          )

          path = Path('fixtures/training/conditional_engagement_candidate_v2_2.json')
          value = json.loads(path.read_text(encoding='utf-8'))
          validate_candidate(value)
          assert EXPECTED_CANDIDATE_SHA256 == '92f10e87f01a388882f621a09989783d561302cc46583a5344e8108c81d864ab'
          assert candidate_sha256(value) == EXPECTED_CANDIDATE_SHA256
          assert hashlib.sha256(path.read_bytes()).hexdigest() == EXPECTED_CANDIDATE_SHA256
          assert value['policy_boundaries']['automatic_tool_filtering'] is False
          assert value['policy_boundaries']['offered_tool_hinting_only'] is True

          def state():
              return {
                  'units_summary': [{'can_attack': True, 'idle': False} for _ in range(4)],
                  'enemy_summary': [],
                  'enemy_buildings_summary': [],
                  'military': {'kills_cost': 0, 'deaths_cost': 0},
              }
          h1 = snapshot_from_state(state(), round_no=1, selected_tool='attack_move')
          h2 = snapshot_from_state(state(), round_no=2, selected_tool='attack_move')
          decision = select_mode(value, snapshot_from_state(state(), round_no=3), [h1, h2])
          assert decision['mode'] == 'FORCE_CONVERSION'
          coaching = format_coaching(decision, ['attack_move', 'move_units'])
          assert 'PREFERRED_MOVE_UNITS_SELECTOR=unit_ids="all_combat"' in coaching
          assert 'use unit_ids="all_combat" exactly' in coaching
          print('CONDITIONAL_ENGAGEMENT_V2_2_SELECTOR_INTEGRITY_R1_GREEN')
          PY
