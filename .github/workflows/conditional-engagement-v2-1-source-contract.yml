name: conditional-engagement-v2-1-source-contract

on:
  pull_request:
    paths:
      - openra_env/coaching/__init__.py
      - openra_env/coaching/conditional_engagement_v2_1.py
      - openra_env/coaching/conditional_engagement_session_v2_1.py
      - fixtures/training/conditional_engagement_candidate_v2_1.json
      - tests/test_conditional_engagement_v2_1.py
      - tests/test_conditional_engagement_v2_1_exports.py
      - .github/workflows/conditional-engagement-v2-1-source-contract.yml
  push:
    branches:
      - main
      - ren/conditional-engagement-v2-1-force-conversion-v1
    paths:
      - openra_env/coaching/__init__.py
      - openra_env/coaching/conditional_engagement_v2_1.py
      - openra_env/coaching/conditional_engagement_session_v2_1.py
      - fixtures/training/conditional_engagement_candidate_v2_1.json
      - tests/test_conditional_engagement_v2_1.py
      - tests/test_conditional_engagement_v2_1_exports.py
      - .github/workflows/conditional-engagement-v2-1-source-contract.yml

permissions:
  contents: read

jobs:
  contract:
    name: Python ${{ matrix.python-version }} V2.1 force-conversion contract
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile V2.1 source
        run: |
          python -m py_compile \
            openra_env/coaching/__init__.py \
            openra_env/coaching/conditional_engagement_v2_1.py \
            openra_env/coaching/conditional_engagement_session_v2_1.py \
            tests/test_conditional_engagement_v2_1.py \
            tests/test_conditional_engagement_v2_1_exports.py
      - name: Run V2.1 focused tests
        run: |
          python -m pytest -q \
            tests/test_conditional_engagement_v2_1.py \
            tests/test_conditional_engagement_v2_1_exports.py
      - name: Verify exact V2.1 candidate fixture
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from openra_env.coaching.conditional_engagement_v2_1 import candidate_sha256, validate_candidate

          expected = "a0b08f7a7ea807de53416f589790059e2540404f680d6b470395bdbdc067f460"
          path = Path("fixtures/training/conditional_engagement_candidate_v2_1.json")
          candidate = json.loads(path.read_text(encoding="utf-8"))
          validate_candidate(candidate)
          assert candidate_sha256(candidate) == expected
          assert hashlib.sha256(path.read_bytes()).hexdigest() == expected
          assert candidate["policy_boundaries"]["runtime_seed_branching"] is False
          assert candidate["policy_boundaries"]["unit_type_specific_rule"] is False
          assert candidate["automatic_apollyon_weight_mutation"] is False
          assert candidate["automatic_abaddon_policy_promotion"] is False
          assert candidate["automatic_corpus_admission"] is False
          print("CONDITIONAL_ENGAGEMENT_V2_1_EXACT_GREEN")
          PY
