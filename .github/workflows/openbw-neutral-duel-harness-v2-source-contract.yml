name: openbw-neutral-duel-harness-v2-source-contract

"on":
  pull_request:
    paths:
      - integrations/openbw/CMakeLists.txt
      - integrations/openbw/neutral_smoke_bot.cpp
      - openra_env/learning/openbw_neutral_duel_harness_v2.py
      - tests/test_openbw_neutral_duel_harness_v2.py
      - docs/learning/openbw-neutral-duel-harness-v2.md
      - .github/workflows/openbw-neutral-duel-harness-v2-source-contract.yml
  push:
    branches:
      - main
    paths:
      - integrations/openbw/CMakeLists.txt
      - integrations/openbw/neutral_smoke_bot.cpp
      - openra_env/learning/openbw_neutral_duel_harness_v2.py
      - tests/test_openbw_neutral_duel_harness_v2.py
      - docs/learning/openbw-neutral-duel-harness-v2.md
      - .github/workflows/openbw-neutral-duel-harness-v2-source-contract.yml

permissions:
  contents: read

jobs:
  contract:
    name: Python ${{ matrix.python-version }} OpenBW neutral duel harness v2
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          submodules: false
          fetch-depth: 0

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: ${{ matrix.python-version }}

      - name: Bind pull-request integration generation
        if: github.event_name == 'pull_request'
        env:
          EXPECTED_INTEGRATION_SHA: ${{ github.sha }}
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_INTEGRATION_SHA"
          read -r actual_base actual_head extra <<<"$(git show -s --format='%P' HEAD)"
          test "$actual_base" = "$EXPECTED_BASE_SHA"
          test "$actual_head" = "$EXPECTED_HEAD_SHA"
          test -z "${extra:-}"
          git diff --check "$actual_base" "$actual_head"

      - name: Install focused dependencies
        run: python -m pip install --disable-pip-version-check pytest ruff

      - name: Compile source contract
        run: |
          python -m py_compile \
            openra_env/learning/openbw_neutral_duel_harness_v2.py \
            tests/test_openbw_neutral_duel_harness_v2.py

      - name: Run source contract tests
        run: python -m pytest -q tests/test_openbw_neutral_duel_harness_v2.py

      - name: Lint source contract
        run: |
          python -m ruff check \
            openra_env/learning/openbw_neutral_duel_harness_v2.py \
            tests/test_openbw_neutral_duel_harness_v2.py

      - name: Prove source-only boundary
        run: |
          printf '%s\n' \
            'runtime_execution=false' \
            'casc_access=false' \
            'game_execution=false' \
            'bot_load=false' \
            'model_execution=false' \
            'training=false' \
            'deployment=false'
