name: joint-advance-post-commit-immutability-source-contract

on:
  pull_request:
    paths:
      - bench_joint_advance.py
      - bench_joint_advance_core.py
      - tests/test_joint_advance_post_commit_immutability.py
      - test_bench_joint_advance.py
      - .github/workflows/joint-advance-post-commit-immutability-source-contract.yml
  push:
    branches:
      - satoshi/joint-advance-throughput-accounting-v1
      - main
    paths:
      - bench_joint_advance.py
      - bench_joint_advance_core.py
      - tests/test_joint_advance_post_commit_immutability.py
      - test_bench_joint_advance.py
      - .github/workflows/joint-advance-post-commit-immutability-source-contract.yml

permissions:
  contents: read

jobs:
  source-contract:
    name: Python ${{ matrix.python-version }} post-commit immutability
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile facade, core, and falsifiers
        run: |
          python -m py_compile \
            bench_joint_advance.py \
            bench_joint_advance_core.py \
            tests/test_joint_advance_post_commit_immutability.py
      - name: Run post-commit immutability falsifiers
        run: python -m unittest -v tests/test_joint_advance_post_commit_immutability.py
      - name: Run full benchmark contract
        run: python -m unittest -v test_bench_joint_advance.py
      - name: Prove reviewed core blob remains available behind facade
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path

          facade = Path('bench_joint_advance.py').read_text(encoding='utf-8')
          core = Path('bench_joint_advance_core.py').read_bytes()
          assert 'post_commit_report_mutation' in facade
          assert 'bench_joint_advance_core.py' in facade
          assert len(core) > 100_000
          print('core_sha256=' + hashlib.sha256(core).hexdigest())
          print('VOID_WAR_COLLEGE_POST_COMMIT_IMMUTABILITY_GREEN')
          PY
