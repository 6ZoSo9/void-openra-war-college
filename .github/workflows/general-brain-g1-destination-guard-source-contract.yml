name: general-brain-g1-destination-guard-source-contract

on:
  pull_request:
    paths:
      - tools/conditional_engagement_v2_2_g1_destination_guard_duel_wrapper.py
      - tests/test_general_brain_destination_guard.py
      - .github/workflows/general-brain-g1-destination-guard-source-contract.yml

permissions:
  contents: read

jobs:
  contract:
    name: Python ${{ matrix.python-version }} General Brain G1 destination guard
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install focused dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile destination guard
        run: |
          python -m py_compile \
            tools/conditional_engagement_v2_2_g1_destination_guard_duel_wrapper.py \
            tests/test_general_brain_destination_guard.py
      - name: Run destination guard tests
        run: python -m pytest -q tests/test_general_brain_destination_guard.py
      - name: Prove runtime boundary
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          from tools.conditional_engagement_v2_2_g1_destination_guard_duel_wrapper import _destination_guard_text
          text = _destination_guard_text('move_units', ['unit_ids','target_x','target_y'])
          assert 'unit_ids="all_combat"' in text
          assert 'never use -1' in text
          assert 'do not choose move_units' in text
          assert _destination_guard_text('attack_move', ['target_x','target_y']) == ''
          print('GENERAL_BRAIN_G1_DESTINATION_GUARD_GREEN')
          PY
