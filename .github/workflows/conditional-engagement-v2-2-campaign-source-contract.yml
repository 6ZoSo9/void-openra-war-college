name: conditional-engagement-v2-2-campaign-source-contract

on:
  pull_request:
    paths:
      - openra_env/analysis/spar_v22_campaign.py
      - openra_env/analysis/spar_v22_matrix.py
      - tests/test_spar_v22_campaign.py
      - .github/workflows/conditional-engagement-v2-2-campaign-source-contract.yml

permissions:
  contents: read

jobs:
  contract:
    name: Python ${{ matrix.python-version }} V2.2 campaign contract
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install focused dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile V2.2 campaign source
        run: |
          python -m py_compile \
            openra_env/analysis/spar_v22_campaign.py \
            openra_env/analysis/spar_v22_matrix.py \
            tests/test_spar_v22_campaign.py
      - name: Run V2.2 campaign tests
        run: python -m pytest -q tests/test_spar_v22_campaign.py
      - name: Prove frozen reviewed campaign plan
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          from openra_env.analysis.spar_v22_campaign import (
              REVIEWED_CAMPAIGN_SEEDS,
              REVIEWED_PAIR_COUNT,
              reviewed_plan,
          )
          assert REVIEWED_CAMPAIGN_SEEDS == (2051, 2055, 2052, 2053, 2054)
          assert REVIEWED_PAIR_COUNT == 15
          plan = reviewed_plan()
          assert plan['required_pair_count'] == 15
          assert all(row['required_pairs'] == 3 for row in plan['seeds'])
          assert 2060 not in [row['seed'] for row in plan['seeds']]
          print('CONDITIONAL_ENGAGEMENT_V2_2_CAMPAIGN_EXACT_GREEN')
          PY
