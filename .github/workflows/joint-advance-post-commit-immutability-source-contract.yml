name: joint-advance-post-commit-immutability-source-contract

on:
  pull_request:
    paths:
      - bench_joint_advance.py
      - bench_joint_advance_core.py
      - tests/test_joint_advance_post_commit_immutability.py
      - test_bench_joint_advance.py
      - .github/workflows/joint-advance-post-commit-immutability-source-contract.yml
  push:
    branches:
      - satoshi/joint-advance-throughput-accounting-v1
      - main
    paths:
      - bench_joint_advance.py
      - bench_joint_advance_core.py
      - tests/test_joint_advance_post_commit_immutability.py
      - test_bench_joint_advance.py
      - .github/workflows/joint-advance-post-commit-immutability-source-contract.yml

permissions:
  contents: read

jobs:
  source-contract:
    name: Python ${{ matrix.python-version }} post-commit immutability
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    env:
      EVENT_NAME: ${{ github.event_name }}
      SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      INTEGRATION_SHA: ${{ github.sha }}
    steps:
      - name: Checkout integration generation
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 2
          persist-credentials: false
          submodules: false
      - name: Checkout exact source head
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ env.SOURCE_HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false
          path: exact-head
      - name: Checkout current pull-request base ref
        if: github.event_name == 'pull_request'
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          path: live-base
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Prove integration and exact-head identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$INTEGRATION_SHA"
          test "$(git -C exact-head rev-parse HEAD)" = "$SOURCE_HEAD_SHA"

          if [ "$EVENT_NAME" = "pull_request" ]; then
            read -r integration_base_sha integration_source_sha extra_parent \
              <<< "$(git show -s --format=%P HEAD)"
            test -n "$integration_base_sha"
            test -n "$integration_source_sha"
            test -z "${extra_parent:-}"
            test "$integration_source_sha" = "$SOURCE_HEAD_SHA"
            live_base_sha="$(git -C live-base rev-parse HEAD)"
            test -n "$live_base_sha"
            test "$integration_base_sha" = "$live_base_sha"
          else
            integration_base_sha="$EVENT_BASE_SHA"
            live_base_sha="$integration_base_sha"
          fi
          export INTEGRATION_BASE_SHA="$integration_base_sha"
          export LIVE_BASE_SHA="$live_base_sha"
          printf 'INTEGRATION_BASE_SHA=%s\nLIVE_BASE_SHA=%s\n' \
            "$INTEGRATION_BASE_SHA" "$LIVE_BASE_SHA" >> "$GITHUB_ENV"

          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          paths = (
              "bench_joint_advance.py",
              "bench_joint_advance_core.py",
              "tests/test_joint_advance_post_commit_immutability.py",
              "test_bench_joint_advance.py",
              ".github/workflows/joint-advance-post-commit-immutability-source-contract.yml",
          )
          manifest = {
              "event_base_sha": os.environ["EVENT_BASE_SHA"],
              "integration_base_sha": os.environ["INTEGRATION_BASE_SHA"],
              "live_base_sha": os.environ["LIVE_BASE_SHA"],
              "integration_sha": os.environ["INTEGRATION_SHA"],
              "source_head_sha": os.environ["SOURCE_HEAD_SHA"],
              "paths": {},
          }
          for rel in paths:
              integration_bytes = Path(rel).read_bytes()
              source_bytes = (Path("exact-head") / rel).read_bytes()
              manifest["paths"][rel] = {
                  "integration_sha256": hashlib.sha256(integration_bytes).hexdigest(),
                  "source_head_sha256": hashlib.sha256(source_bytes).hexdigest(),
                  "integration_bytes": len(integration_bytes),
                  "source_head_bytes": len(source_bytes),
                  "byte_identical": integration_bytes == source_bytes,
              }
          mismatched_paths = [
              rel
              for rel, evidence in manifest["paths"].items()
              if not evidence["byte_identical"]
          ]
          if mismatched_paths:
              raise SystemExit(
                  "integration/source byte mismatch: " + ",".join(mismatched_paths)
              )
          print(json.dumps(manifest, sort_keys=True, separators=(",", ":")))
          PY
      - name: Verify committed-range hygiene
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git -C exact-head cat-file -e "${INTEGRATION_BASE_SHA}^{commit}"
          git -C exact-head cat-file -e "${SOURCE_HEAD_SHA}^{commit}"
          MERGE_BASE_SHA="$(git -C exact-head merge-base "$INTEGRATION_BASE_SHA" "$SOURCE_HEAD_SHA")"
          test -n "$MERGE_BASE_SHA"
          git -C exact-head diff --check "${MERGE_BASE_SHA}...${SOURCE_HEAD_SHA}"
          printf 'integration_base_sha=%s\nlive_base_sha=%s\nsource_head_sha=%s\nmerge_base_sha=%s\nintegration_sha=%s\n' \
            "$INTEGRATION_BASE_SHA" "$LIVE_BASE_SHA" "$SOURCE_HEAD_SHA" "$MERGE_BASE_SHA" "$INTEGRATION_SHA"
      - name: Verify pushed-head hygiene
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          if git -C exact-head rev-parse HEAD^ >/dev/null 2>&1; then
            git -C exact-head diff --check HEAD^ HEAD
          else
            git -C exact-head diff --check HEAD
          fi
      - name: Compile integration facade, core, and falsifiers
        run: |
          python -m py_compile \
            bench_joint_advance.py \
            bench_joint_advance_core.py \
            tests/test_joint_advance_post_commit_immutability.py \
            test_bench_joint_advance.py
      - name: Run integration post-commit immutability falsifiers
        run: python -m unittest -v tests/test_joint_advance_post_commit_immutability.py
      - name: Run integration full benchmark contract
        run: python -m unittest -v test_bench_joint_advance.py
      - name: Compile exact-head facade, core, and falsifiers
        shell: bash
        run: |
          set -euo pipefail
          cd exact-head
          python -m py_compile \
            bench_joint_advance.py \
            bench_joint_advance_core.py \
            tests/test_joint_advance_post_commit_immutability.py \
            test_bench_joint_advance.py
      - name: Run exact-head post-commit immutability falsifiers
        shell: bash
        run: |
          set -euo pipefail
          cd exact-head
          python -m unittest -v tests/test_joint_advance_post_commit_immutability.py
      - name: Run exact-head full benchmark contract
        shell: bash
        run: |
          set -euo pipefail
          cd exact-head
          python -m unittest -v test_bench_joint_advance.py
      - name: Prove reviewed core blob remains available behind exact-head facade
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path

          root = Path('exact-head')
          facade = (root / 'bench_joint_advance.py').read_text(encoding='utf-8')
          core = (root / 'bench_joint_advance_core.py').read_bytes()
          assert 'post_commit_report_mutation' in facade
          assert 'bench_joint_advance_core.py' in facade
          assert len(core) > 100_000
          print('core_sha256=' + hashlib.sha256(core).hexdigest())
          print('VOID_WAR_COLLEGE_POST_COMMIT_IMMUTABILITY_GREEN')
          PY
