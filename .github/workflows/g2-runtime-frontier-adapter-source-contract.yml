name: g2-runtime-frontier-adapter-source-contract

"on":
  pull_request:
    paths:
      - openra_env/agent.py
      - openra_env/learning/g2_runtime_candidate_frontier.py
      - openra_env/learning/g2_runtime_capability_projection.py
      - openra_env/learning/g2_runtime_compiled_comparator_gate.py
      - openra_env/learning/g2_runtime_tool_classification.py
      - tests/test_g2_runtime_frontier_adapter_v1.py
      - tests/test_g2_runtime_frontier_source_contract_v1.py
      - tests/test_g2_runtime_comparator_loader_v1.py
      - tests/test_agent_phase_tool_surfaces_v1.py
      - .github/workflows/g2-runtime-frontier-adapter-source-contract.yml
  push:
    branches:
      - main
    paths:
      - openra_env/agent.py
      - openra_env/learning/g2_runtime_candidate_frontier.py
      - openra_env/learning/g2_runtime_capability_projection.py
      - openra_env/learning/g2_runtime_compiled_comparator_gate.py
      - openra_env/learning/g2_runtime_tool_classification.py
      - tests/test_g2_runtime_frontier_adapter_v1.py
      - tests/test_g2_runtime_frontier_source_contract_v1.py
      - tests/test_g2_runtime_comparator_loader_v1.py
      - tests/test_agent_phase_tool_surfaces_v1.py
      - .github/workflows/g2-runtime-frontier-adapter-source-contract.yml

permissions:
  contents: read

jobs:
  contract:
    name: Python ${{ matrix.python-version }} G2 runtime frontier contract
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          submodules: false
          fetch-depth: 0

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Bind pull-request integration generation
        if: github.event_name == 'pull_request'
        env:
          EXPECTED_INTEGRATION_SHA: ${{ github.sha }}
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          actual_integration_sha="$(git rev-parse HEAD)"
          test "$actual_integration_sha" = "$EXPECTED_INTEGRATION_SHA"

          read -r actual_base_sha actual_head_sha extra_parent <<<"$(git show -s --format='%P' HEAD)"
          test -n "$actual_base_sha"
          test -n "$actual_head_sha"
          test -z "${extra_parent:-}"
          test "$actual_base_sha" = "$EXPECTED_BASE_SHA"
          test "$actual_head_sha" = "$EXPECTED_HEAD_SHA"

          git cat-file -e "${actual_base_sha}^{commit}"
          git cat-file -e "${actual_head_sha}^{commit}"
          git diff --check "$actual_base_sha" "$actual_head_sha"

          printf 'integration_sha=%s\nbase_sha=%s\nsource_head_sha=%s\n' \
            "$actual_integration_sha" "$actual_base_sha" "$actual_head_sha"

      - name: Install focused dependencies
        run: python -m pip install --disable-pip-version-check pytest ruff

      - name: Compile G2 runtime frontier source
        run: |
          python -m py_compile \
            openra_env/agent.py \
            openra_env/learning/g2_runtime_candidate_frontier.py \
            openra_env/learning/g2_runtime_capability_projection.py \
            openra_env/learning/g2_runtime_compiled_comparator_gate.py \
            openra_env/learning/g2_runtime_tool_classification.py \
            tests/test_g2_runtime_frontier_adapter_v1.py \
            tests/test_g2_runtime_frontier_source_contract_v1.py \
            tests/test_g2_runtime_comparator_loader_v1.py \
            tests/test_agent_phase_tool_surfaces_v1.py

      - name: Run G2 runtime frontier contract tests
        run: |
          python -m pytest -q \
            tests/test_g2_runtime_frontier_adapter_v1.py \
            tests/test_g2_runtime_frontier_source_contract_v1.py \
            tests/test_g2_runtime_comparator_loader_v1.py \
            tests/test_agent_phase_tool_surfaces_v1.py

      - name: Lint G2 runtime frontier source
        run: |
          python -m ruff check \
            openra_env/agent.py \
            openra_env/learning/g2_runtime_candidate_frontier.py \
            openra_env/learning/g2_runtime_capability_projection.py \
            openra_env/learning/g2_runtime_compiled_comparator_gate.py \
            openra_env/learning/g2_runtime_tool_classification.py \
            tests/test_agent_phase_tool_surfaces_v1.py

      - name: Prove source-only boundary
        run: |
          set -euo pipefail
          test ! -e /etc/void/allow-local-ollama-model-runtime
          printf '%s\n' \
            'runtime_execution=false' \
            'model_execution=false' \
            'provider_called=false' \
            'game_started=false' \
            'runtime_install=false' \
            'deployment=false' \
            'training=false' \
            'weights_updated=false'
