name: openbw-s1-merged-runtime-qualification-source-contract

"on":
  pull_request:
    paths:
      - config/war-college/openbw-s1-merged-builder-runtime-qualification-v1.json
      - docs/learning/openbw-s1-merged-builder-runtime-qualification-v1.md
      - tests/test_openbw_s1_merged_runtime_qualification_v1.py
      - .github/workflows/openbw-s1-merged-runtime-qualification-source-contract.yml
  push:
    branches:
      - main
    paths:
      - config/war-college/openbw-s1-merged-builder-runtime-qualification-v1.json
      - docs/learning/openbw-s1-merged-builder-runtime-qualification-v1.md
      - tests/test_openbw_s1_merged_runtime_qualification_v1.py
      - .github/workflows/openbw-s1-merged-runtime-qualification-source-contract.yml

permissions:
  contents: read

jobs:
  contract:
    name: Python ${{ matrix.python-version }} merged OpenBW S1 runtime qualification
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          submodules: false
          fetch-depth: 0

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Bind pull-request integration generation
        if: github.event_name == 'pull_request'
        env:
          EXPECTED_INTEGRATION_SHA: ${{ github.sha }}
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          actual_integration_sha="$(git rev-parse HEAD)"
          test "$actual_integration_sha" = "$EXPECTED_INTEGRATION_SHA"
          read -r actual_base_sha actual_head_sha extra_parent <<<"$(git show -s --format='%P' HEAD)"
          test -n "$actual_base_sha"
          test -n "$actual_head_sha"
          test -z "${extra_parent:-}"
          test "$actual_base_sha" = "$EXPECTED_BASE_SHA"
          test "$actual_head_sha" = "$EXPECTED_HEAD_SHA"
          git diff --check "$actual_base_sha" "$actual_head_sha"

      - name: Install focused dependencies
        run: python -m pip install --disable-pip-version-check pytest ruff

      - name: Compile qualification contract test
        run: python -m py_compile tests/test_openbw_s1_merged_runtime_qualification_v1.py

      - name: Run qualification contract test
        run: python -m pytest -q tests/test_openbw_s1_merged_runtime_qualification_v1.py

      - name: Lint qualification contract test
        run: python -m ruff check tests/test_openbw_s1_merged_runtime_qualification_v1.py

      - name: Prove source-only boundary
        run: |
          printf '%s\n' \
            'runtime_execution=false' \
            'casc_access=false' \
            'game_execution=false' \
            'bot_load=false' \
            'model_execution=false' \
            'training=false' \
            'deployment=false'
