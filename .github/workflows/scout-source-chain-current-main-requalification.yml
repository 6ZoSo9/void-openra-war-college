name: scout-source-chain-current-main-requalification

"on":
  pull_request:
    paths:
      - openra_env/learning/abaddon_scout_external_**
      - openra_env/learning/abaddon_scout_post_run_**
      - openra_env/learning/abaddon_scout_result_evidence_**
      - openra_env/learning/abaddon_scout_canary_**
      - openra_env/learning/abaddon_scout_repair_**
      - fixtures/learning/scout-missions-v1/scout_repair_canary_derived_runner_v1.py
      - tests/test_abaddon_scout_**
      - docs/learning/abaddon-scout-**
      - config/war-college/scout-source-chain-current-main-requalification-v1.json
      - tests/test_scout_source_chain_current_main_requalification_v1.py
      - docs/learning/scout-source-chain-current-main-requalification-v1.md
      - .github/workflows/scout-source-chain-current-main-requalification.yml
  push:
    branches:
      - main
    paths:
      - openra_env/learning/abaddon_scout_external_**
      - openra_env/learning/abaddon_scout_post_run_**
      - openra_env/learning/abaddon_scout_result_evidence_**
      - openra_env/learning/abaddon_scout_canary_**
      - openra_env/learning/abaddon_scout_repair_**
      - fixtures/learning/scout-missions-v1/scout_repair_canary_derived_runner_v1.py
      - tests/test_abaddon_scout_**
      - docs/learning/abaddon-scout-**
      - config/war-college/scout-source-chain-current-main-requalification-v1.json
      - tests/test_scout_source_chain_current_main_requalification_v1.py
      - docs/learning/scout-source-chain-current-main-requalification-v1.md
      - .github/workflows/scout-source-chain-current-main-requalification.yml

permissions:
  contents: read

jobs:
  contract:
    name: Python ${{ matrix.python-version }} scout source-chain requalification
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          submodules: false
          fetch-depth: 0

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: ${{ matrix.python-version }}

      - name: Bind pull-request integration generation
        if: github.event_name == 'pull_request'
        env:
          EXPECTED_INTEGRATION_SHA: ${{ github.sha }}
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_INTEGRATION_SHA"
          read -r actual_base actual_head extra <<<"$(git show -s --format='%P' HEAD)"
          test "$actual_base" = "$EXPECTED_BASE_SHA"
          test "$actual_head" = "$EXPECTED_HEAD_SHA"
          test -z "${extra:-}"
          git diff --check "$actual_base" "$actual_head"

      - name: Install focused dependencies
        run: python -m pip install --disable-pip-version-check pytest ruff

      - name: Verify exact requalification receipt
        run: python -m pytest -q tests/test_scout_source_chain_current_main_requalification_v1.py

      - name: Run consolidated scout focused tests
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys

          with open(
              "config/war-college/scout-source-chain-current-main-requalification-v1.json",
              encoding="utf-8",
          ) as handle:
              receipt = json.load(handle)
          tests = sorted(
              path
              for path in receipt["payload_blobs"]
              if path.startswith("tests/") and path.endswith(".py")
          )
          assert tests
          subprocess.run([sys.executable, "-m", "pytest", "-q", *tests], check=True)
          PY

      - name: Lint consolidated Python payload
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys

          with open(
              "config/war-college/scout-source-chain-current-main-requalification-v1.json",
              encoding="utf-8",
          ) as handle:
              receipt = json.load(handle)
          paths = sorted(
              path
              for path in receipt["payload_blobs"]
              if path.endswith(".py")
          )
          paths.append("tests/test_scout_source_chain_current_main_requalification_v1.py")
          subprocess.run([sys.executable, "-m", "ruff", "check", *paths], check=True)
          PY

      - name: Prove source-only boundary
        run: |
          printf '%s\n' \
            'game_execution=false' \
            'model_execution=false' \
            'runtime_activation=false' \
            'attempt_consumption=false' \
            'training=false' \
            'policy_promotion=false' \
            'deployment=false' \
            'wallet_or_funds_action=false'
