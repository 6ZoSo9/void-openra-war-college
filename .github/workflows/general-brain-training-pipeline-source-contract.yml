name: general-brain-training-pipeline-source-contract

on:
  pull_request:
    paths:
      - openra_env/learning/**
      - tools/general_brain_training_pipeline.py
      - tests/test_general_brain_generation.py
      - tests/test_general_brain_training.py
      - .github/workflows/general-brain-training-pipeline-source-contract.yml
  push:
    branches:
      - main
      - ren/general-brain-training-pipeline-v1
    paths:
      - openra_env/learning/**
      - tools/general_brain_training_pipeline.py
      - tests/test_general_brain_generation.py
      - tests/test_general_brain_training.py
      - .github/workflows/general-brain-training-pipeline-source-contract.yml

permissions:
  contents: read

jobs:
  contract:
    name: Python ${{ matrix.python-version }} General Brain training pipeline
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install focused dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile learning source
        run: |
          python -m py_compile \
            openra_env/learning/general_brain_generation.py \
            openra_env/learning/general_brain_training.py \
            tools/general_brain_training_pipeline.py \
            tests/test_general_brain_generation.py \
            tests/test_general_brain_training.py
      - name: Run focused learning tests
        run: |
          python -m pytest -q \
            tests/test_general_brain_generation.py \
            tests/test_general_brain_training.py
      - name: Prove authority never enters adapter weights
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          from openra_env.learning.general_brain_generation import NONTRAINABLE_AUTHORITY_ENVELOPE
          from openra_env.learning.general_brain_training import ADAPTER_SCHEMA

          assert ADAPTER_SCHEMA == 'void.general-brain-tactical-preference-adapter.v1'
          assert NONTRAINABLE_AUTHORITY_ENVELOPE['authority_policy_trainable'] is False
          assert NONTRAINABLE_AUTHORITY_ENVELOPE['role_hierarchy_trainable'] is False
          assert NONTRAINABLE_AUTHORITY_ENVELOPE['sovereign_directives_trainable'] is False
          assert NONTRAINABLE_AUTHORITY_ENVELOPE['tool_authorization_trainable'] is False
          assert NONTRAINABLE_AUTHORITY_ENVELOPE['promotion_authority_trainable'] is False
          print('GENERAL_BRAIN_TRAINING_PIPELINE_AUTHORITY_SEPARATION_GREEN')
          PY
